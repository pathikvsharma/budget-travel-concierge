[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-travel-concierge"
version = "1.0.0"
description = "TripPilot: Budget-Smart Multi-Agent Travel Concierge built with Google ADK-Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "google-adk>=2.14.0,<3.0.0",
  "google-genai>=1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "python-dotenv>=1.0.1",
  "aiosqlite>=0.20.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "greenlet>=3.0.0",
  "python-json-logger>=3.0.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-gcp-trace>=1.6.0",
  "google-cloud-secret-manager>=2.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "rouge-score>=0.1.2",
  "tabulate>=0.9.0",
]
# Required by `adk eval` (live golden evaluation suite).
eval = [
  "google-adk[eval]>=2.14.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["travel_concierge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  # ADK 2.x marks Sequential/Parallel/LoopAgent as deprecated in favor of Workflow,
  # but Workflow cannot yet be an LlmAgent sub-agent (required by the coordinator).
  "ignore:.*is deprecated in favor of Workflow.*:DeprecationWarning",
]
